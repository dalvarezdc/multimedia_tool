[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimedia-tool"
version = "0.1.0"
description = "Autonomous Retro Pixel & AI Video Engine with BytePlus Seedance Integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arkruntime>=0.0.1",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
multimedia = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

