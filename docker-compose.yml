services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: multimedia-tool-api:local
    env_file:
      - path: .env
        required: false
    environment:
      SERVE_UI: "0"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_VIDEO_PROVIDER: ${DEFAULT_VIDEO_PROVIDER:-seedance}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
      ARK_LLM_MODEL: ${ARK_LLM_MODEL:-seed-2-0-lite-260228}
      ARK_SEEDANCE_MODEL: ${ARK_SEEDANCE_MODEL:-dreamina-seedance-2-5-260628}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      XAI_VIDEO_MODEL: ${XAI_VIDEO_MODEL:-grok-imagine-video-1.5}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:8080}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PROTON_CLIENT_ID: ${PROTON_CLIENT_ID:-}
      PROTON_CLIENT_SECRET: ${PROTON_CLIENT_SECRET:-}
    volumes:
      - data:/app/data
      - uploads:/app/uploads
      - renders:/app/renders
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: multimedia-tool-web:local
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
  uploads:
  renders:
