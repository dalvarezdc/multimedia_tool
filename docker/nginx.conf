server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index app.html;

    client_max_body_size 100m;

    # API, OpenAPI, generated media — proxied to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    location /renders/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location = /portal {
        try_files /index.html =404;
    }

    location = /landing {
        try_files /index.html =404;
    }

    location = / {
        try_files /app.html =404;
    }

    location = /app { try_files /app.html =404; }
    location = /video { try_files /app.html =404; }
    location = /multimedia { try_files /app.html =404; }
    location = /rpg { try_files /app.html =404; }
    location = /api-keys { try_files /app.html =404; }
    location = /docs { try_files /app.html =404; }
    location = /settings { try_files /app.html =404; }
    location = /usage { try_files /app.html =404; }

    location / {
        try_files $uri $uri/ /app.html;
    }
}
