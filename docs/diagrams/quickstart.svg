<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Multimedia Tool quick start</title>
  <desc id="description">Four steps: install once, start the Studio, describe an idea, and download the result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <path d="M270 150h60m210 0h60m210 0h60" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#64748b" stroke-width="2" filter="url(#shadow)">
    <rect x="30" y="48" width="240" height="204" rx="20" fill="#111827"/>
    <rect x="330" y="48" width="210" height="204" rx="20" fill="#111827"/>
    <rect x="600" y="48" width="210" height="204" rx="20" fill="#111827"/>
    <rect x="870" y="48" width="300" height="204" rx="20" fill="#111827"/>
  </g>
  <g font-family="Helvetica" text-anchor="middle">
    <g fill="#22d3ee" font-size="16" font-weight="700">
      <text x="150" y="82">1 · INSTALL ONCE</text>
      <text x="435" y="82">2 · START</text>
      <text x="705" y="82">3 · CREATE</text>
      <text x="1020" y="82">4 · SAVE</text>
    </g>
    <g fill="#f8fafc" font-size="21" font-weight="650">
      <text x="150" y="135">make install</text>
      <text x="435" y="135">make dev</text>
      <text x="705" y="135">Describe your idea</text>
      <text x="1020" y="135">Preview &amp; download</text>
    </g>
    <g fill="#94a3b8" font-size="16">
      <text x="150" y="178">Sets up the app</text>
      <text x="150" y="201">for you</text>
      <text x="435" y="178">Open localhost:8000</text>
      <text x="705" y="178">Choose settings, then</text>
      <text x="705" y="201">press Generate</text>
      <text x="1020" y="178">Find a copy in the Studio</text>
      <text x="1020" y="201">and in renders/</text>
    </g>
  </g>
  <g fill="#a78bfa">
    <path d="M310 142l12 8-12 8z"/>
    <path d="M580 142l12 8-12 8z"/>
    <path d="M850 142l12 8-12 8z"/>
  </g>
</svg>
