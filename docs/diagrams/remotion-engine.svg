<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%" role="img" aria-labelledby="rmTitle rmDesc">
  <title id="rmTitle">Remotion pixel engine</title>
  <desc id="rmDesc">Storyboard JSON drives compositions into a 60fps master MP4.</desc>
  <defs>
    <marker id="rmTipGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D3A05B"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#F7F7F7"/>
  <rect x="32" y="24" width="16" height="1" fill="#D3A05B"/>
  <text x="56" y="30" fill="#D3A05B" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em">REMOTION</text>
  <text x="32" y="68" fill="#13233C" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">Pixel roadmap to</text>
  <text x="256" y="68" fill="#D3A05B" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.025em">master MP4</text>

  <rect x="32" y="108" width="180" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="48" y="144" fill="#13233C" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Storyboard JSON</text>
  <text x="48" y="168" fill="#5E7695" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12">Chapters, platforms</text>

  <path d="M212 156 H252" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.8" marker-end="url(#rmTipGold)"/>

  <rect x="252" y="108" width="200" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="268" y="144" fill="#13233C" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Compositions</text>
  <text x="268" y="168" fill="#5E7695" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12">Parallax, platforms, Hermes</text>

  <path d="M452 156 H492" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.8" marker-end="url(#rmTipGold)"/>

  <rect x="492" y="108" width="160" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="508" y="144" fill="#13233C" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Cutscene slots</text>
  <text x="508" y="168" fill="#5E7695" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12">Seedance / Grok clips</text>

  <path d="M652 156 H692" fill="none" stroke="#D3A05B" stroke-width="1.5" stroke-opacity="0.8" marker-end="url(#rmTipGold)"/>

  <rect x="692" y="108" width="156" height="96" rx="16" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1"/>
  <text x="708" y="144" fill="#13233C" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">60 FPS MP4</text>
  <text x="708" y="168" fill="#5E7695" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12">renders/</text>

  <text x="32" y="252" fill="#5E7695" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="14">Preview with `make remotion`. Render with `npm run build` in remotion/.</text>
  <text x="32" y="312" fill="#D3A05B" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.22em">SELKET.AI</text>
</svg>
